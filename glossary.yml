#         contexts.yml), overrides (optional per-context def/plain/source/note), note, agreed.

- term: ACT Middlesbrough
  id: act-middlesbrough
  abbr: ACT
  full_term: Accessing Change Together
  aliases: ACT Middlesbrough|ACT|Accessing Change Together
  type: local-programme
  definition: Middlesbrough Council's integrated adult social care service that brings support 
    together for people facing domestic abuse, homelessness and substance use; trained advisers 
    assess need and connect people to the right teams.
  source: Middlesbrough Council — Accessing Change Together (ACT)
  source_url: https://www.middlesbrough.gov.uk/adult-social-care/accessing-change-together/
  org_ref: ''
  org_ref_url:
  scope:
  - clr.hf
  note: Middlesbrough Council adult social care integrated service.
  agreed: y
- term: Adult Social Care
  id: adult-social-care
  abbr: ASC
  full_term: Adult Social Care
  aliases: Adult Social Care|ASC
  type: statutory
  definition: The statutory function of a local authority to provide care and support for adults 
    with care and support needs, governed by the Care Act 2014 (the s.1 'promoting individual 
    well-being' principle underpins it).
  source: Care Act 2014 (Part 1; s.1)
  source_url: https://www.legislation.gov.uk/ukpga/2014/23/contents
  org_ref: ''
  org_ref_url:
  scope:
  - clr.kw
  note: Sourced to the Care Act 2014 (the KW report already attributes it there). The Act frames the
    duties rather than giving a one-line 'adult social care means...' definition, so the definition 
    describes the function. In South Tees, Middlesbrough Council and Redcar & Cleveland Borough 
    Council each run their own Adult Social Care, with the duties falling on each authority 
    separately.
  agreed: y
