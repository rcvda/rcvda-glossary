# RCVDA estate glossary — single source of truth.
# Edit this file; run build.py to regenerate the estate master + every lens.
# Fields: term, id (stable estate-unique key — NEVER key on abbr), abbr, full_term, aliases,
#         type, definition, plain (optional reading-age-10 form), source(+_url) [law/authority],
