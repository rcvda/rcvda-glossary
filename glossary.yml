- term: CAPVA
  id: capva
  abbr: CAPVA
  full_term: Child / Adolescent to Parent Violence and Abuse
  aliases: CAPVA
  type: substantive
  definition: Abuse perpetrated by a child or adolescent against a parent or carer. Where those 
    involved are both aged 16 or over it also falls within the statutory definition of domestic 
    abuse (Domestic Abuse Act 2021, s.1).
  source: 'Tees Child Protection Partnership — Child to Parent Violence and Abuse guidance; the national
    concept is set out in the Home Office (2015) Information guide: Adolescent to Parent Violence and
    Abuse'
  source_url: 
    https://www.teescpp.org.uk/procedures-and-guidance-on-specific-issues-that-affect-children/child-to-parent-violence-and-abuse/
  org_ref: ''
  org_ref_url:
  scope:
  - clr.da
  note: 'Like PCN, NOT a statutory term — a recognised form of abuse described in Home Office guidance
    (issued nationally as ''APVA''; the ''C'' adds ''child''). No stable gov.uk URL: the guide has been
    withdrawn/re-hosted, so no link is attached — add a canonical copy if the team agrees one.'
  agreed: y
