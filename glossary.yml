- term: Areas of complex need (five areas of work)
  id: areas-of-complex-need-five-areas-of-work
  abbr: ''
  full_term: Areas of complex need (five areas of work)
  aliases: areas of complex need|areas of work|five areas
  type: local-programme
  definition: 'The five overlapping areas of need that define who the programme works with: criminal justice,
    mental health, homelessness, domestic abuse and substance use. In South Tees a person must be in contact
    with two or more of these to access the service (South Tees Delivery Plan); the national Changing
    Futures cohort (MHCLG 2020 Prospectus) is defined more narrowly as three or more. These are the areas
    of work (the ''what''), distinct from the six delivery workstreams (the ''how'').'
  source: South Tees Delivery Plan (Version 2); MHCLG (2020) Changing Futures Prospectus (cohort 
    definition).
  source_url:
  org_ref: ''
  org_ref_url:
  scope: []
  note: New shared entry to make the two taxonomies explicit. Two of the deep dives (Domestic Abuse,
    Homelessness) focus on one of these five areas; the others focus on a workstream.
  agreed: y
