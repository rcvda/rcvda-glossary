- term: Cleveland
  id: cleveland
  abbr: ''
  full_term: Cleveland
  aliases: Cleveland
  type: statutory
  definition: The former county of Cleveland (1974–1996), created by the Local Government Act 1972 
    and abolished by the Cleveland (Structural Change) Order 1995, which replaced it with four 
    unitary authorities — Middlesbrough, Redcar & Cleveland, Stockton-on-Tees and Hartlepool. The 
    name survives in bodies whose footprint still covers that geography, notably Cleveland Police 
    and its Office of the Police and Crime Commissioner (OPCC).
  source: The Cleveland (Structural Change) Order 1995 (SI 1995/187), which abolished the county 
    created by the Local Government Act 1972; the geography survives as the Cleveland Police / OPCC 
    footprint.
  source_url: https://www.legislation.gov.uk/uksi/1995/187
  org_ref: ''
  org_ref_url:
  scope:
