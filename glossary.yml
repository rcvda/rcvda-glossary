  abbr: CF
  full_term: Changing Futures
  aliases: Changing Futures|CF
  type: substantive
  definition: The national programme testing system-change approaches for adults facing multiple 
    disadvantage, jointly funded by Ministry of Housing, Communities and Local Government (MHCLG) 
    and The National Lottery Community Fund (TNLCF); £91.8m across fifteen areas of England, 
    2021–2026. 'Changing Futures' on its own means this national programme; the local delivery is 
    the South Tees Changing Futures Programme.
