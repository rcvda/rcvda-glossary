    in a worker's own inner experience and worldview that results from empathic engagement with 
    trauma survivors over time.
  source: 'McCann, I.L. and Pearlman, L.A. (1990) Vicarious traumatisation: a framework for understanding
    the psychological effects of working with victims.'
