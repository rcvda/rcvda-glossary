- term: Workstream
  id: workstream
  abbr: ''
  full_term: Workstream
  aliases: workstream
  type: local-programme
  definition: 'One of the strands the programme is organised into. The Delivery Plan sets out six: a governance
    strand (Programme Management and Ideas Factory) and five delivery strands — Enhanced Case Management,
    Innovation Fund, Key Worker Support, VCS Infrastructure, and Embedding Trauma-Informed Services. Workstreams
    are how the programme delivers, as distinct from the five areas of complex need that define who it
    works with.'
  source: South Tees Delivery Plan (Version 2); STCFP Board Terms of Reference.
  source_url:
  org_ref: ''
  org_ref_url:
  scope:
  - clr.tip
  note: 'NOT a conflict: the Delivery Plan lists six workstreams (one governance/management + five delivery);
    the Board ToR counts the FIVE delivery workstreams and renumbers them 1–5 (it sets aside Programme
    Management because that governance layer is what the Board itself is — confirmed: ToR numbers VCS
    Infrastructure as WS4 and Embedding TIP as WS5, i.e. Delivery Plan WS2–6). State it as: 5 areas of
    need (what) → governed/managed via Programme Management & Ideas Factory → delivered through 5 delivery
    workstreams. Deep dives map to an area of need (Domestic Abuse, Homelessness) or a delivery workstream
    (Key Worker; TIP = Embedding Trauma-Informed Services). Governance strand bodies: Programme Board,
    Programme Management Sub-Group, Lived Experience Board, System Change Lead.'
  agreed: y
