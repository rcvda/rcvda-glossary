- term: Trauma-informed practice (TIP)
  id: trauma-informed-practice-tip
  abbr: TIP
  full_term: Trauma-informed practice
  aliases: trauma-informed practice|TIP
  type: substantive
  definition: A whole-system approach to realising the prevalence of trauma, recognising its 
    effects, responding by embedding that knowledge in practice, and resisting re-traumatisation. 
    The series adopts the Office for Health Improvement and Disparities (OHID) (2022) England 
    working definition, with Substance Abuse and Mental Health Services Administration (SAMHSA)'s 
    (2014) four assumptions and six principles as the underlying framework.
  source: OHID (2022) Working definition of trauma-informed practice (GOV.UK)
  source_url: 
    https://www.gov.uk/government/publications/working-definition-of-trauma-informed-practice/working-definition-of-trauma-informed-practice
  org_ref: ''
  org_ref_url:
  scope:
  - clr.hf
  - clr.kw
  - clr.md
  - clr.tip
  note: 'Resolves the anchor conflict: OHID 2022 is the canonical definition, SAMHSA 2014 the underlying
    framework, Champions Charter the local operationalisation — name all three consistently. TIP §2.3
    is the series source. The South Tees Trauma-Informed Champions Charter is the local operationalisation;
    ''trauma-informed care (TIC)'' is preserved only where source documents use it.'
  agreed: y
